name: Build Notchium

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-notchium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source and version tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test and package the committed source
        shell: bash
        run: |
          version=$(sed -n 's/^MARKETING_VERSION = //p' Config/Shared.xcconfig)
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo 'The tag must match MARKETING_VERSION.' >&2
              exit 1
            }
            ./scripts/release.sh "$version"
          else
            ./scripts/release.sh "$version" --candidate
          fi

      - name: Upload the DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Notchium-${{ github.ref_type == 'tag' && 'release' || 'candidate' }}-${{ github.sha }}
          path: |
            dist/*/Notchium-*.dmg
            dist/*/Notchium-*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
