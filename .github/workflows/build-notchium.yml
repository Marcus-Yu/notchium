name: Build Notchium

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-notchium-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Check out source and version tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test and package the committed source
        shell: bash
        run: |
          version=$(sed -n 's/^MARKETING_VERSION = //p' Config/Shared.xcconfig)
          ./scripts/release.sh "$version" --candidate

      - name: Upload the test DMG and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Notchium-candidate-${{ github.sha }}
          path: |
            dist/*-candidate/Notchium-*.dmg
            dist/*-candidate/Notchium-*.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
